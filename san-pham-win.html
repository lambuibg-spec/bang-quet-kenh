<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sản Phẩm Có Video Win</title>
<style>
:root{--nen:#f6f7f9;--the:#fff;--vien:#e3e6ea;--chu:#1a1d21;--mo:#6b7280;--xanh:#0f7b6c;--do:#c0392b;--cam:#d97706;--xanhduong:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bao{max-width:1600px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px;text-align:center;letter-spacing:.03em}
.mo{color:var(--mo);font-size:13px}
.dau{text-align:center;margin-bottom:14px}
.muc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 0}
.muc a{padding:7px 13px;border:1px solid var(--vien);background:#fff;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--chu);text-decoration:none}
.muc a.bat{background:var(--chu);color:#fff;border-color:var(--chu)}
.the{background:var(--the);border:1px solid var(--vien);border-radius:10px;padding:16px;margin-bottom:16px}
a{color:var(--xanhduong);text-decoration:none}a:hover{text-decoration:underline}
.loc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.loc input,.loc select{padding:8px 11px;border:1px solid var(--vien);border-radius:7px;font:inherit;background:#fff;max-width:100%}
.loc input{flex:1;min-width:180px}
.loc button{padding:7px 12px;border:1px solid var(--vien);background:#fff;border-radius:7px;font:inherit;font-size:12.5px;cursor:pointer}
.loc button.bat{background:var(--chu);color:#fff;border-color:var(--chu)}
.loc button b{font-weight:800}
.dem{font-size:12.5px;color:var(--mo)}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sp{border:1px solid var(--vien);border-radius:9px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.sp .anh{width:100%;aspect-ratio:1;object-fit:cover;background:#f0f2f4;display:block}
.sp .trong{width:100%;aspect-ratio:1;background:#f0f2f4;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px}
.sp .th{padding:9px 10px;flex:1;display:flex;flex-direction:column;gap:5px}
.sp .ten{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sp .ng{font-size:11px;color:var(--mo)}
.sp .so{display:flex;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--mo);padding-top:5px;border-top:1px solid #f0f2f4}
.sp .so b{color:var(--chu)}
.nhan{position:absolute;left:8px;top:8px;background:var(--do);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px}
.hg{position:absolute;right:8px;top:8px;background:rgba(26,29,33,.82);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.vw{font-weight:800;font-size:20px;line-height:1.1;padding:4px 10px;border-radius:8px;background:#16a34a;color:#fff;display:inline-block}
.vw small{font-weight:600;font-size:11px;margin-left:6px}
.vd{font-size:11.5px;display:flex;justify-content:space-between;gap:6px}
.vd span{color:var(--mo);white-space:nowrap}
.len{color:#16a34a;font-weight:700}.xuong{color:var(--do);font-weight:700}
.them{display:block;width:100%;margin-top:14px;padding:10px;border:1px solid var(--vien);background:#fff;border-radius:8px;font:inherit;cursor:pointer}
.cuon{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid #eef0f2;text-align:left;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mo)}
td.s,th.s{text-align:right;font-variant-numeric:tabular-nums}
.o4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.o4 div{background:#f6f7f9;border-radius:8px;padding:10px 12px}
.o4 b{display:block;font-size:20px;line-height:1.2}
.o4 span{font-size:12px;color:var(--mo)}
.ghichu{font-size:12px;color:var(--mo);margin-top:12px;line-height:1.5}
.loi{padding:14px;color:var(--do);font-weight:600}
.danhsach{display:flex;flex-direction:column;border:1px solid var(--vien);border-radius:9px;overflow:hidden;background:#fff}
.dsd,.dsd0{display:grid;grid-template-columns:70px 64px minmax(0,1fr) 190px 110px 100px;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid #eef0f2}
.dsd:last-child{border-bottom:0}
.dsd:hover{background:#f9fafb}
.dsd0{background:#f6f7f9;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mo);padding:7px 12px}
.dsh{text-align:center;line-height:1.2}.dsh b{font-size:18px}.dsh small{display:block;font-size:10.5px;color:var(--mo)}
.dsd .dsa{width:64px;height:64px;object-fit:cover;border-radius:7px;background:#f0f2f4;display:block}
.dsd .dst2 .ten{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dsd .dst2 .ng{font-size:11.5px;color:var(--mo);margin-top:2px}
.dsd .nhan{position:static;display:inline-block;margin-right:6px;vertical-align:1px}
.dsd .dsn{font-size:12.5px;font-variant-numeric:tabular-nums}
.dsd .dsl{font-size:12.5px;text-align:right}
.loc .nhom{font-size:12px;color:var(--mo);margin-left:6px}
.dsd.k4,.dsd0.k4{grid-template-columns:70px 64px minmax(0,1fr) 100px 150px minmax(0,230px) 100px}
.dsd .vd2{font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsd .vd2 span{color:var(--mo)}
@media(max-width:760px){.dsd.k4{grid-template-columns:54px 56px minmax(0,1fr)}.dsd .vd2{white-space:normal}}
@media(max-width:760px){
  .dsd0{display:none}
  .dsd{grid-template-columns:54px 56px minmax(0,1fr);gap:8px}
  .dsd .dsa{width:56px;height:56px}
  .dsd .dsn,.dsd .dsl{grid-column:3;text-align:left}
}

.nhanx{position:absolute;left:8px;top:8px;background:var(--cam);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px}
</style></head><body><div class="bao">
<div class="dau"><h1>SẢN PHẨM CÓ VIDEO WIN</h1>
  <div class="mo" id="phu">đang tải…</div>
  <div class="muc"><a href="index.html">Tìm sản phẩm win</a><a href="seller.html">Seller hằng ngày</a><a href="nhom-40k.html">Nhóm 40K hằng ngày</a><a class="bat" href="san-pham-win.html">Sản phẩm có video win</a></div></div>
<div class="the">
  <div class="o4" id="o4"></div>
  <div class="loc" id="hopche">
    <button data-c="1m" class="bat">Video từ 1 triệu view</button>
    <button data-c="x3">Sản phẩm x từ 3 trở lên</button>
  </div>
  <div class="loc" id="hopme"></div>
  <div class="loc">
    <select id="nganhcon" aria-label="Ngành con"></select>
    <input id="ts" placeholder="tìm tên sản phẩm / kênh / shop / mã...">
    <select id="xep" aria-label="Sắp xếp"></select>
    <span class="dem" id="dems"></span>
  </div>
  <div class="luoi" id="luoi"></div>
  <button class="them" id="them">Xem thêm</button>
  <div class="ghichu" id="ghichu"></div>
</div>
<script>
const DL = 'https://raw.githubusercontent.com/lambuibg-spec/bang-quet-kenh/main/dl/';
const so = n => (n||0).toLocaleString('vi-VN');
const gon = n => n>=1e9 ? (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tỷ' : n>=1e6 ? (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr'
  : n>=1e4 ? Math.round(n/1e3).toLocaleString('vi-VN')+'k' : so(n);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const tenNgay = n => n ? n.slice(8,10)+'/'+n.slice(5,7) : '';
const nho = (k, v) => { try { if (v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } };
async function tai(duong){
  const r = await fetch(DL + duong + '?t=' + Math.floor(Date.now()/300000), {cache:'no-store'});
  if (!r.ok) throw new Error('không tải được ' + duong + ' (' + r.status + ')');
  return r.json();
}
const baoLoi = e => { document.getElementById('luoi').innerHTML = '<div class="loi">Chưa tải được dữ liệu: '+esc(e.message||e)+'</div>'; };

let CM = null, KHO = {}, X3 = null, cheDo = nho('win_che') || '1m', c1 = nho('win_c1') || '', c2 = '', hien = 60;
const linkV = (k, v) => `https://www.tiktok.com/@${encodeURIComponent(k||'_')}/video/${v}`;
const gia = n => n ? so(n) + 'đ' : '';
const dsVideo = (vs, tong) => vs.slice(0,4).map(v => `<div class="vd"><a href="${linkV(v[1],v[0])}" target="_blank" rel="noopener">@${esc(v[1]||'video')}</a><span>${gon(v[2])} view${v[3]?' · '+tenNgay(v[3])+'/'+v[3].slice(2,4):''}</span></div>`).join('')
  + (tong>4?`<div class="ng">và ${so(tong-4)} video khác</div>`:'');
const anhThe = a => a ? `<img class="anh" src="${esc(a)}" loading="lazy" alt="">` : '<div class="trong">chưa có ảnh</div>';
const moSP = m => `<div class="ng"><a href="https://shop.tiktok.com/vn/pdp/${esc(m)}" target="_blank" rel="noopener">mở sản phẩm</a></div>`;
function veMe(){
  hopme.style.display = cheDo==='1m' ? 'flex' : 'none';
  nganhcon.style.display = cheDo==='1m' ? '' : 'none';
  hopme.innerHTML = CM.nganh.map(n => `<button data-m="${n[0]}" class="${n[0]===c1?'bat':''}">${esc(n[1])} · <b>${so(n[2])}</b> sản phẩm</button>`).join('');
  xep.innerHTML = cheDo==='1m'
    ? '<option value="tv">Tổng view video win cao trước</option><option value="top">Video mạnh nhất trước</option><option value="n">Nhiều video win trước</option><option value="hg">Hạng bán chạy Seller</option><option value="ds">Doanh số cao trước</option>'
    : '<option value="tv">Tổng view cao trước</option><option value="x">x cao trước</option><option value="don">Đơn 7 ngày cao trước</option>';
}
async function ve(){
  document.querySelectorAll('#hopche button').forEach(b => b.classList.toggle('bat', b.dataset.c===cheDo));
  const q = ts.value.trim().toLowerCase();
  try {
    if (cheDo==='x3'){
      if (!X3) { luoi.innerHTML = '<div class="dem">đang tải…</div>'; X3 = (await tai('win/x3.json')).sp; }
      let r = X3.filter(x => !q || x[1].toLowerCase().includes(q) || x[0].includes(q) || x[9].some(v => v[1].toLowerCase().includes(q)));
      if (xep.value==='x') r = r.slice().sort((a,b) => b[3]-a[3]); else if (xep.value==='don') r = r.slice().sort((a,b) => b[4]-a[4]);
      dems.textContent = so(r.length)+' / '+so(X3.length)+' sản phẩm';
      luoi.innerHTML = r.slice(0, hien).map(x => `
        <div class="sp"><span class="nhanx">x ${x[3].toLocaleString('vi-VN')}</span>${anhThe(x[2])}
          <div class="th"><div class="ten">${esc(x[1])||'<span style="color:#9ca3af">chưa có tên</span>'}</div>
            <div><span class="vw">${gon(x[6])}<small>view</small></span></div>
            <div class="so"><span><b>${so(x[7])}</b> video</span>${x[8]?`<span><b>${so(x[8])}</b> video ≥1tr</span>`:''}<span>7 ngày <b>${so(x[4])}</b> đơn</span>${x[5]?`<span><b>${so(x[5])}</b> người bán</span>`:''}</div>
            ${dsVideo(x[9], x[7])}
            ${x[10]||x[11]?`<div class="ng">${gia(x[10])}${x[10]&&x[11]?' · ':''}${esc(x[11])}</div>`:''}
            ${moSP(x[0])}
          </div></div>`).join('') || '<div class="dem">chưa có sản phẩm nào</div>';
      them.style.display = r.length > hien ? 'block' : 'none'; them.textContent = 'Xem thêm (' + so(r.length-hien) + ' sản phẩm nữa)';
      return;
    }
    if (!c1) { luoi.innerHTML = '<div class="dem">chưa có dữ liệu</div>'; return; }
    if (!KHO[c1]) { luoi.innerHTML = '<div class="dem">đang tải…</div>'; KHO[c1] = (await tai('win/'+c1+'.json')).sp; }
    const ds = KHO[c1];
    const dem = {}; ds.forEach(x => dem[x[3]] = (dem[x[3]]||0)+1);
    if (c2 && !dem[c2]) c2 = '';
    nganhcon.innerHTML = `<option value="">Mọi ngành con — ${so(ds.length)} sản phẩm</option>` +
      Object.keys(dem).sort((a,b) => dem[b]-dem[a]).map(n => `<option value="${esc(n)}" ${n===c2?'selected':''}>${esc(n||'chưa rõ')} — ${so(dem[n])}</option>`).join('');
    let r = ds.filter(x => (!c2 || x[3]===c2) && (!q || x[1].toLowerCase().includes(q) || x[0].includes(q) || x[12].toLowerCase().includes(q) || x[10].some(v => v[1].toLowerCase().includes(q))));
    const k = xep.value;
    if (k==='top') r = r.slice().sort((a,b) => b[10][0][2]-a[10][0][2]);
    else if (k==='n') r = r.slice().sort((a,b) => b[9]-a[9] || b[8]-a[8]);
    else if (k==='hg') r = r.slice().sort((a,b) => (a[5]||9999)-(b[5]||9999));
    else if (k==='ds') r = r.slice().sort((a,b) => b[7]-a[7]);
    dems.textContent = so(r.length)+' / '+so(ds.length)+' sản phẩm';
    luoi.innerHTML = r.slice(0, hien).map(x => `
      <div class="sp">${x[13]?'<span class="nhanx">x≥3</span>':''}${x[5]?`<span class="hg">Seller #${x[5]}</span>`:''}${anhThe(x[2])}
        <div class="th"><div class="ten">${esc(x[1])}</div>
          <div class="ng">${esc(x[3])}${x[4]&&x[4]!==x[3]?' › '+esc(x[4]):''}</div>
          <div><span class="vw">${gon(x[8])}<small>view</small></span></div>
          <div class="so"><span><b>${so(x[9])}</b> video ≥1tr</span>${x[7]?`<span>Doanh số <b>$${x[6].toLocaleString('vi-VN')}K–$${x[7].toLocaleString('vi-VN')}K</b></span>`:''}</div>
          ${dsVideo(x[10], x[9])}
          ${x[11]||x[12]?`<div class="ng">${gia(x[11])}${x[11]&&x[12]?' · ':''}${esc(x[12])}</div>`:''}
          ${moSP(x[0])}
        </div></div>`).join('') || '<div class="dem">không có sản phẩm nào khớp</div>';
    them.style.display = r.length > hien ? 'block' : 'none'; them.textContent = 'Xem thêm (' + so(r.length-hien) + ' sản phẩm nữa)';
  } catch(e) { baoLoi(e); }
}
hopche.onclick = e => { const b = e.target.closest('button'); if (!b) return; cheDo = b.dataset.c; nho('win_che', cheDo); hien = 60; veMe(); ve(); };
hopme.onclick = e => { const b = e.target.closest('button'); if (!b) return; c1 = b.dataset.m; nho('win_c1', c1); c2 = ''; hien = 60; veMe(); ve(); };
nganhcon.onchange = () => { c2 = nganhcon.value; hien = 60; ve(); };
ts.oninput = () => { hien = 60; ve(); };
xep.onchange = () => { hien = 60; ve(); };
them.onclick = () => { hien += 240; ve(); };
tai('win/ngay.json').then(j => { CM = j;
  if (!j.nganh.some(n => n[0]===c1)) c1 = (j.nganh.slice().sort((a,b) => b[2]-a[2])[0]||[''])[0];
  if (cheDo==='x3' && !j.x3.so_sp) cheDo = '1m';
  phu.textContent = 'cập nhật ' + j.cap_nhat + (j.luc_kho ? ' · kho video win dựng lúc ' + j.luc_kho : '');
  o4.innerHTML = `<div><b>${so(j.so_sp)}</b><span>sản phẩm có video từ 1 triệu view</span></div><div><b>${so(j.so_video)}</b><span>video từ 1 triệu view</span></div>
    <div><b>${so(j.x3.so_sp)}</b><span>sản phẩm x từ 3 trở lên</span></div><div><b>${so(j.x3.so_video)}</b><span>video của sản phẩm x≥3 đã đo view</span></div>`;
  ghichu.innerHTML = '«Video từ 1 triệu view»: sản phẩm lấy từ bảng bán chạy của TikTok Seller (quét tới từng ngành con), video là video bán sản phẩm đó đã đo được từ 1 triệu view. '
    + 'Mỗi sản phẩm hiện tối đa 4 video mạnh nhất. View là số lúc máy đo, không phải view hiện tại. Doanh số là khoảng ước tính của Seller, đơn vị nghìn đô-la.<br>'
    + '«Sản phẩm x từ 3 trở lên»: x = số đơn 7 ngày chia số người bán, do dàn điện thoại bóc mã chấm; hiện mọi video của sản phẩm, kể cả video ít view.';
  veMe(); ve(); }).catch(e => { phu.textContent = ''; baoLoi(e); });
</script></div></body></html>
